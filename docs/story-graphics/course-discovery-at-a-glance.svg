<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">California Virtual Campus course discovery at a glance</title>
  <desc id="desc">Three statistics show the scale of course discovery across California community colleges, alongside the student challenge of translating academic jargon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#e7f0ff"/><stop offset="1" stop-color="#d7e7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#344b72" flood-opacity=".12"/></filter>
    <style>
      .overline{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.8px;fill:#5c7193}.title{font:700 33px Inter,Arial,sans-serif;fill:#172b4d}.copy{font:400 15px Inter,Arial,sans-serif;fill:#405573}.metric{font:700 46px Inter,Arial,sans-serif;fill:#172b4d}.label{font:700 12px Inter,Arial,sans-serif;letter-spacing:1px;fill:#536e95}.card-title{font:700 18px Inter,Arial,sans-serif;fill:#172b4d}.pill{font:700 12px Inter,Arial,sans-serif;fill:#47658b}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="148" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="86" y="85" class="overline">THE CHALLENGE</text>
  <text x="86" y="126" class="title">Course discovery at California scale</text>
  <text x="86" y="157" class="copy">Students need clear guidance across a large, distributed online course network.</text>
  <g filter="url(#shadow)">
    <rect x="46" y="238" width="225" height="214" rx="22" fill="#fff" stroke="#91b5f3" stroke-width="2"/>
    <rect x="46" y="238" width="225" height="58" rx="22" fill="url(#blue)"/><path d="M46 275h225v21H46z" fill="url(#blue)"/>
    <circle cx="78" cy="267" r="17" fill="#397be0"/><path d="M70 265h16M70 271h16M74 259h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="354" class="metric">116</text><text x="72" y="384" class="card-title">community colleges</text>
    <text x="72" y="420" class="copy">One statewide network</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="301" y="238" width="255" height="214" rx="22" fill="#fff" stroke="#75cfa6" stroke-width="2"/>
    <rect x="301" y="238" width="255" height="58" rx="22" fill="#e8fbf2"/><path d="M301 275h255v21H301z" fill="#e8fbf2"/>
    <circle cx="333" cy="267" r="17" fill="#159a63"/><circle cx="333" cy="263" r="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M324 277c2-7 16-7 18 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="327" y="354" class="metric">2.2M</text><text x="327" y="384" class="card-title">students served</text>
    <text x="327" y="420" class="copy">Across California each year</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="586" y="238" width="255" height="214" rx="22" fill="#fff" stroke="#f0a153" stroke-width="2"/>
    <rect x="586" y="238" width="255" height="58" rx="22" fill="#fff3e5"/><path d="M586 275h255v21H586z" fill="#fff3e5"/>
    <circle cx="618" cy="267" r="17" fill="#e77b25"/><path d="M610 260h16v14h-16zM613 264h10M613 269h10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="612" y="354" class="metric">100K+</text><text x="612" y="384" class="card-title">online courses</text>
    <text x="612" y="420" class="copy">Available across the network</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="883" y="218" width="271" height="260" rx="22" fill="#fff" stroke="#ed91b3" stroke-width="2"/>
    <rect x="883" y="218" width="271" height="55" rx="22" fill="#fff0f4"/><path d="M883 254h271v19H883z" fill="#fff0f4"/>
    <text x="910" y="251" class="card-title">The student barrier</text>
    <text x="910" y="307" class="label">ACADEMIC TERMINOLOGY</text>
    <rect x="910" y="327" width="95" height="31" rx="15" fill="#fff0f4"/><text x="925" y="348" class="pill">CSU Area 3</text>
    <rect x="1014" y="327" width="69" height="31" rx="15" fill="#fff0f4"/><text x="1029" y="348" class="pill">IGETC</text>
    <rect x="910" y="371" width="153" height="31" rx="15" fill="#fff0f4"/><text x="925" y="392" class="pill">delivery method</text>
    <text x="910" y="439" class="copy">Jargon can turn a search</text><text x="910" y="460" class="copy">into a barrier to action.</text>
  </g>
  <rect x="46" y="535" width="1108" height="105" rx="20" fill="#172b4d"/>
  <text x="82" y="576" class="overline" fill="#b7d0ff">DESIGN OPPORTUNITY</text>
  <text x="82" y="612" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Translate student goals into course options—without requiring students to learn the system first.</text>
</svg>
